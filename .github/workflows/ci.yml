name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still going (macOS minutes are the expensive ones).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Secret scan, build, unit tests, self-tests, iPhone app
        run: scripts/ci.sh --ios
